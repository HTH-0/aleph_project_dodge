<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DODGE — 30초 생존</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="page">
  <section class="game-shell">
    <header class="topbar">
      <div class="logo"><span></span>DODGE</div>
      <div class="goal">30 SECOND SURVIVAL</div>
    </header>

    <div class="game-wrap">
      <canvas id="gameCanvas"></canvas>

      <div id="hud" class="hud hidden">
        <div class="hud-item">
          <small>SCORE</small>
          <strong id="score">0</strong>
        </div>
        <div class="hud-center">
          <small id="difficultyLabel">EASY</small>
          <strong id="difficultyValue">쉬움</strong>
        </div>
        <div class="hud-item right">
          <small>TIME</small>
          <strong id="time">30.0s</strong>
        </div>
      </div>

      <div id="startScreen" class="overlay">
        <div class="panel">
          <div class="eyebrow">SURVIVAL PROTOCOL</div>
          <h1>DODGE</h1>
          <p>난이도를 선택하고 30초 동안 탄막을 피하세요.</p>

          <div class="difficulty-select">
            <button class="difficulty active" data-difficulty="easy">
              <b>쉬움</b><span>기본 속도 · 3개</span>
            </button>
            <button class="difficulty" data-difficulty="normal">
              <b>보통</b><span>빠른 탄막 · 5개</span>
            </button>
            <button class="difficulty" data-difficulty="hard">
              <b>어려움</b><span>고속 탄막 · 8개</span>
            </button>
          </div>

          <div class="tips">
            <div><b>MOVE</b><span>W A S D / 방향키</span></div>
            <div><b>GOAL</b><span>30초 생존</span></div>
            <div><b>HITBOX</b><span>중앙의 작은 원</span></div>
          </div>

          <button id="startButton" class="primary">GAME START</button>
        </div>
      </div>

      <div id="resultScreen" class="overlay hidden">
        <div class="panel">
          <div class="eyebrow">RESULT</div>
          <h2 id="resultTitle">GAME OVER</h2>
          <p id="resultMessage">장애물에 피격되었습니다.</p>
          <div class="result-grid">
            <div><small>DIFFICULTY</small><strong id="finalDifficulty">쉬움</strong></div>
            <div><small>SCORE</small><strong id="finalScore">0</strong></div>
            <div><small>SURVIVAL</small><strong id="finalTime">0.0s</strong></div>
          </div>
          <button id="restartButton" class="primary">RESTART</button>
          <button id="menuButton" class="secondary">난이도 다시 선택</button>
        </div>
      </div>
    </div>

    <footer class="footer">
      <span>WASD / ARROW KEYS TO MOVE</span>
      <span>30 SEC · 1 LIFE</span>
    </footer>
  </section>
</main>

<script src="js/input.js"></script>
<script src="js/player.js"></script>
<script src="js/obstacle.js"></script>
<script src="js/particle.js"></script>
<script src="js/ui.js"></script>
<script src="js/game.js"></script>
</body>
</html>
